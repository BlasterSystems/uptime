# DEV deployment for the Proxmox docker VM (LXC 106), carrigo-style:
# the image is built on the VM from the git-bundle checkout — no GHCR auth
# needed on the VM. `deploy/.env` on the VM is the source of truth; CI never
# rewrites it (git clean excludes it).
name: uptime-dev

services:
  uptime:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: uptime-dev:latest
    container_name: uptime-dev
    ports:
      - '3101:3101'
    environment:
      PORT: 3101
      SEED: '0'
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set in deploy/.env}
      UPTIME_AGENT_TOKEN: ${UPTIME_AGENT_TOKEN:-}
    volumes:
      - uptime-data:/data
      # Host Docker socket (read-only mount) so `docker` monitors can reach the
      # local daemon. The socket GID differs per host — set DOCKER_GID in
      # deploy/.env (`stat -c %g /var/run/docker.sock`).
      - /var/run/docker.sock:/var/run/docker.sock:ro
    group_add:
      - '${DOCKER_GID:-999}'
    tmpfs:
      - /tmp
    read_only: true
    restart: unless-stopped

volumes:
  uptime-data:
