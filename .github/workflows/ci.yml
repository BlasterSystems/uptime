name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Dependabot PRs and fork PRs are untrusted on a public repo — keep them on
    # GitHub-hosted runners; everything else runs on the self-hosted dev-VM runner.
    runs-on: ${{ (github.actor == 'dependabot[bot]' || github.event.pull_request.head.repo.fork == true) && 'ubuntu-latest' || 'uptime-dev-vm' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # pnpm/action-setup shells out to the runner's bundled npm, which is
      # truncated (disk-full during a self-update) and dies with
      # "Cannot find module '../lib/cli.js'". corepack ships inside the
      # setup-node toolchain and provisions pnpm from packageManager.
      - run: corepack enable pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm coverage
      - run: pnpm build
      - run: .agentic/bin/validate
      - run: .agentic/bin/docs-check

  # End-to-end flows against the built app: fresh throwaway server per run,
  # real Chromium. Kept out of `pnpm -r test` (no browsers in the check job).
  e2e:
    # Dependabot PRs and fork PRs are untrusted on a public repo — keep them on
    # GitHub-hosted runners; everything else runs on the self-hosted dev-VM runner.
    runs-on: ${{ (github.actor == 'dependabot[bot]' || github.event.pull_request.head.repo.fork == true) && 'ubuntu-latest' || 'uptime-dev-vm' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # pnpm/action-setup shells out to the runner's bundled npm, which is
      # truncated (disk-full during a self-update) and dies with
      # "Cannot find module '../lib/cli.js'". corepack ships inside the
      # setup-node toolchain and provisions pnpm from packageManager.
      - run: corepack enable pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Chromium system libs are preinstalled on the runner host; the runner
      # user has no sudo, so --with-deps cannot work there.
      - run: pnpm --filter @uptime/e2e exec playwright install chromium
      - run: pnpm test:e2e

  # Plan review J4/B1: verify the image builds on both arches in M1 (no publish —
  # GHCR push + SBOM lands in M5).
  image:
    # Dependabot PRs and fork PRs are untrusted on a public repo — keep them on
    # GitHub-hosted runners; everything else runs on the self-hosted dev-VM runner.
    runs-on: ${{ (github.actor == 'dependabot[bot]' || github.event.pull_request.head.repo.fork == true) && 'ubuntu-latest' || 'uptime-dev-vm' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
