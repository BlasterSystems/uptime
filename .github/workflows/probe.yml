name: Runner probe

on:
  push:
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: uptime-dev-vm
    steps:
      - name: Host capabilities
        run: |
          set -x
          uname -a
          whoami; id
          nproc
          free -h | head -2 || true
          df -h / | tail -1
          git --version
          node -v || echo 'node: not on PATH'
          command -v pnpm && pnpm -v || echo 'pnpm: not on PATH'

      - name: Docker / buildx / qemu
        run: |
          set -x
          docker version --format 'client {{.Client.Version}} server {{.Server.Version}}'
          docker info --format 'hostarch {{.Architecture}} ostype {{.OSType}}'
          docker buildx version || echo 'BUILDX MISSING'
          docker run --rm --platform linux/amd64 alpine:3.20 uname -m || echo 'AMD64 EMU FAILED'
          docker run --rm --platform linux/arm64 alpine:3.20 uname -m || echo 'ARM64 EMU FAILED'

      - name: Sudo / apt (playwright --with-deps needs it)
        run: |
          sudo -n true && echo 'PASSWORDLESS SUDO OK' || echo 'NO PASSWORDLESS SUDO'
          command -v apt-get || echo 'no apt-get'
