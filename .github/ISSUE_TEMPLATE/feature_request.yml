name: Feature request
description: Propose an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what blocks you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen? What does it look like in the UI/API?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / prior art
      description: How do you solve this today? How do other tools (Uptime-Kuma, Gatus, Healthchecks) handle it?
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I checked the spec (docs/SPEC.md §13/§14) and this is not already an explicitly deferred or documented deviation
          required: false
